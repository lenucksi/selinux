name: Build and Deploy hello-go

on:
  push:
    branches: [master]
    paths:
      - 'hello-go/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hello-go-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Import GPG key
        id: gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Setup build user
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .
          mkdir -p /packages
          chmod 777 /packages

      - name: Build and sign hello-go
        env:
          GPGKEY: ${{ steps.gpg.outputs.fingerprint }}
        run: |
          GPG_DIR=$(gpgconf --list-dirs homedir)
          cp -r "$GPG_DIR" /home/builder/.gnupg
          chown -R builder:builder /home/builder/.gnupg
          chmod 700 /home/builder/.gnupg
          chmod 600 /home/builder/.gnupg/pubring.kbx /home/builder/.gnupg/trustdb.gpg 2>/dev/null || true
          chmod 700 /home/builder/.gnupg/private-keys-v1.d 2>/dev/null || true
          chmod 600 /home/builder/.gnupg/private-keys-v1.d/* 2>/dev/null || true
          cd hello-go
          sudo -u builder \
            GNUPGHOME=/home/builder/.gnupg \
            GPGKEY="$GPGKEY" \
            PKGDEST=/packages \
            makepkg --clean --noconfirm --sign

      - name: Create signed repo
        env:
          GPGKEY: ${{ steps.gpg.outputs.fingerprint }}
        run: |
          mkdir -p repo/go-hello-world/x86_64
          cp /packages/hello-go-*.pkg.tar.zst repo/go-hello-world/x86_64/
          cp /packages/hello-go-*.pkg.tar.zst.sig repo/go-hello-world/x86_64/
          cp public.asc repo/go-hello-world/x86_64/
          cd repo/go-hello-world/x86_64
          repo-add --sign --verify --include-sigs --key "$GPGKEY" \
            go-hello-world.db.tar.zst hello-go-*.pkg.tar.zst
          ln -sf go-hello-world.db.tar.zst go-hello-world.db
          ln -sf go-hello-world.files.tar.zst go-hello-world.files

      - name: Verify signatures
        run: |
          cd repo/go-hello-world/x86_64
          for pkg in hello-go-*.pkg.tar.zst; do
            gpg --verify "${pkg}.sig" "${pkg}" || exit 1
          done
          gpg --verify go-hello-world.db.tar.zst.sig go-hello-world.db.tar.zst
          echo "All signatures verified"

      - name: Add .nojekyll
        run: touch repo/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: repo

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

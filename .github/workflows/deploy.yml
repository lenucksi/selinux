name: Build and Deploy Signed Repository

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Import GPG key
        id: gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Setup build environment
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git pacman-contrib
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .

      - name: Build and sign package
        env:
          GPGKEY: ${{ steps.gpg.outputs.fingerprint }}
        working-directory: ./selinux-refpolicy-arch
        run: |
          sudo -u builder makepkg --syncdeps --noconfirm --sign

      - name: Create signed pacman repository
        run: |
          mkdir -p repo/x86_64
          cp ./*/*.pkg.tar.zst repo/x86_64/
          for sig in ./*/*.pkg.tar.zst.sig; do
            [ -f "$sig" ] && cp "$sig" repo/x86_64/
          done
          repo-add --sign --verify --include-sigs \
            repo/x86_64/selinux.db.tar.zst repo/x86_64/*.pkg.tar.zst
          cd repo/x86_64
          ln -sf selinux.db.tar.zst selinux.db
          ln -sf selinux.files.tar.zst selinux.files

      - name: Verify package signatures
        run: |
          for pkg in repo/x86_64/*.pkg.tar.zst; do
            gpg --verify "${pkg}.sig" "${pkg}" || exit 1
          done
          echo "All signatures verified successfully"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: repo

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

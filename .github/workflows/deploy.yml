name: Build and Deploy Signed Repository

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Import GPG key
        id: gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Setup build environment
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git pacman-contrib
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .
          mkdir -p /packages

      - name: Build dependency chain with signing
        env:
          GPGKEY: ${{ steps.gpg.outputs.fingerprint }}
          GNUPGHOME: ${{ steps.gpg.outputs.gpg_dir }}
          PKGDEST: /packages
        run: |
          # Copy GPG keyring to builder user
          cp -r "$GNUPGHOME" /home/builder/.gnupg
          chown -R builder:builder /home/builder/.gnupg

          # Build chain: libsepol → libselinux → checkpolicy → semodule-utils
          #                       → libsemanage → policycoreutils → selinux-refpolicy-arch
          build_and_sign() {
            local dir="$1"
            cd "$dir"
            sudo -u builder \
              GNUPGHOME=/home/builder/.gnupg \
              PKGDEST="$PKGDEST" \
              GPGKEY="$GPGKEY" \
              makepkg --syncdeps --noconfirm --sign || exit 1
            cd ..
          }

          install_pkg() {
            local pkg
            pkg=$(ls -t /packages/*.pkg.tar.zst 2>/dev/null | head -1)
            if [ -n "$pkg" ]; then
              pacman --noconfirm -U "$pkg" || exit 1
            else
              echo "ERROR: no package found to install" >&2
              exit 1
            fi
          }

          build_and_sign libsepol
          install_pkg

          build_and_sign libselinux
          install_pkg

          build_and_sign checkpolicy
          install_pkg

          build_and_sign semodule-utils
          install_pkg

          build_and_sign libsemanage
          install_pkg

          build_and_sign policycoreutils
          install_pkg

          build_and_sign selinux-refpolicy-arch

      - name: Create signed pacman repository
        env:
          GPGKEY: ${{ steps.gpg.outputs.fingerprint }}
          GNUPGHOME: ${{ steps.gpg.outputs.gpg_dir }}
        run: |
          mkdir -p repo/x86_64
          cp /packages/*.pkg.tar.zst repo/x86_64/
          for sig in /packages/*.pkg.tar.zst.sig; do
            [ -f "$sig" ] && cp "$sig" repo/x86_64/
          done
          cp public.asc repo/x86_64/
          repo-add --sign --verify --include-sigs --key "$GPGKEY" \
            repo/x86_64/selinux.db.tar.zst repo/x86_64/*.pkg.tar.zst
          cd repo/x86_64
          ln -sf selinux.db.tar.zst selinux.db
          ln -sf selinux.files.tar.zst selinux.files

      - name: Verify package signatures
        env:
          GNUPGHOME: ${{ steps.gpg.outputs.gpg_dir }}
        run: |
          for pkg in repo/x86_64/*.pkg.tar.zst; do
            gpg --verify "${pkg}.sig" "${pkg}" || exit 1
          done
          echo "All signatures verified successfully"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: repo

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
